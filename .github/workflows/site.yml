name: site
on:
  push: { paths: ['site/**', '.github/workflows/site.yml'] }
  pull_request: { paths: ['site/**', '.github/workflows/site.yml'] }
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: AASA and vercel.json are valid JSON
        run: |
          python3 -m json.tool site/.well-known/apple-app-site-association >/dev/null
          python3 -m json.tool site/vercel.json >/dev/null
      - name: HTML validates
        run: npx --yes html-validate@9 site/*.html
      - name: Internal links resolve
        run: |
          python3 - <<'PY'
          import pathlib, re, sys
          root = pathlib.Path("site"); bad = []
          for page in root.glob("*.html"):
              html = page.read_text()
              ids = set(re.findall(r'id="([^"]+)"', html))
              for ref in re.findall(r'(?:href|src)="([^"#:?]*)(#[^"]*)?"', html):
                  path, frag = ref
                  if path.startswith(("//", "assets/screens/")):
                      continue  # screenshots are optional; site.js falls back to placeholders
                  target = root / path if path else page
                  if path and not target.exists():
                      bad.append(f"{page.name}: missing {path}")
                  if frag and frag != "#" and not path and frag[1:] not in ids:
                      bad.append(f"{page.name}: missing anchor {frag}")
          print("\n".join(bad) or "all links resolve"); sys.exit(1 if bad else 0)
          PY

  # Vercel's own Git auto-deploy is off (site/vercel.json): it created a deployment for every push
  # to the repo, and even the skipped ones count toward the free plan's 100 a day. This job is the
  # only thing that puts the site live: a push to main that changes site/, or a manual run.
  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency: { group: site-deploy, cancel-in-progress: false }
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_Rnf6ha4S3iGq1YVKKD2n2dkz
      VERCEL_PROJECT_ID: prj_zdg3Qua1b2IEnlOGBjqriPovftOp
    steps:
      - uses: actions/checkout@v4
      - name: Deploy site/ to production
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN is not set, so the site was not deployed. Add it under Settings > Secrets and variables > Actions, then rerun this workflow."
            exit 1
          fi
          npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN"
